server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://localhost:5432/gusto
    username: gusto
    password: gusto
    hikari:
      maximum-pool-size: 5        # 소규모 프로젝트: 최대 5개 연결
      minimum-idle: 2              # 소규모 프로젝트: 최소 2개 유지
      connection-timeout: 30000    # 연결 대기 시간: 30초
      idle-timeout: 600000         # 유휴 연결 타임아웃: 10분
      max-lifetime: 1800000        # 연결 최대 생존 시간: 30분
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false
    open-in-view: false
  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE
      org.springframework.data.jpa.repository.query: DEBUG
      org.springframework.transaction: DEBUG
      com.gustoexpedition: DEBUG
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info, mappings

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

gusto:
  security:
    whitelist:
      # Actuator
      - "/actuator/**"
      # 브라우저 자동 요청 (Chrome DevTools 등)
      - "/.well-known/**"
      - "/favicon.ico"
      - "/robots.txt"
      # 인증 관련 API (로그인, 토큰 갱신)
      - "/api/auth/login"
      - "/api/auth/refresh"
      # 회원가입 (인증 불필요)
      - "/api/user/signup"
    jwt:
      secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
      access-token-expiration: 600000
      refresh-token-expiration: 604800000
  cors:
    # 기본 CORS 설정 (환경별로 override)
    allowed-origins: []
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    exposed-headers: Authorization,Content-Type
    allow-credentials: true
    max-age: 3600