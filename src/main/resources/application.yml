server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gusto
    username: gusto
    password: gusto
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info, mappings

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}  # 기본값 false, 개발 환경에서만 true

gusto:
  security:
    # AccessToken 검증 불필요 화이트리스트
    whitelist:
      # Actuator
      - "/actuator/**"
      # 브라우저 자동 요청 (Chrome DevTools 등)
      - "/.well-known/**"
      - "/favicon.ico"
      - "/robots.txt"