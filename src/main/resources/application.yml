server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://localhost:5432/gusto
    username: gusto
    password: gusto
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false
    open-in-view: false
  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE
      org.springframework.data.jpa.repository.query: DEBUG
      org.springframework.transaction: DEBUG
      com.gustoexpedition: DEBUG
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info, mappings

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

gusto:
  security:
    whitelist:
      # Actuator
      - "/actuator/**"
      # 브라우저 자동 요청 (Chrome DevTools 등)
      - "/.well-known/**"
      - "/favicon.ico"
      - "/robots.txt"
      # 로그인 필요 없는 api
      - "/api/admin/ingredient/createIngredient"
      - "/api/admin/ingredient/createIngredientI18n"
      - "/api/admin/ingredient/createAlias"
      - "/api/admin/ingredient/selectById"
      - "/api/admin/ingredient/updateIngredient"
      - "/api/admin/ingredient/updateIngredientI18n"
      - "/api/admin/ingredient/updateAliasAll"
      - "/api/admin/ingredient/updateAlias"
      - "/api/admin/ingredient/deleteIngredient"
      - "/api/admin/ingredient/deleteIngredientI18n"
      - "/api/admin/ingredient/deleteAliasAll"
      - "/api/admin/ingredient/deleteAlias"