springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    root: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.data.jpa.repository.query: DEBUG
    org.springframework.transaction: DEBUG
    com.gustoexpedition: DEBUG
  file:
    name: logs/gusto-backend.log

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gusto}
    username: ${DB_USERNAME:gusto}
    password: ${DB_PASSWORD:gusto}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false
    open-in-view: false

LOG_FORMAT: ${LOG_FORMAT:PLAIN}
LOG_PATH: ${LOG_PATH:./logs}

gusto:
  cors:
    # 개발 환경: 개발 서버 origin 허용
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
      - ${CORS_ALLOWED_ORIGIN_2:}
    allow-credentials: true
