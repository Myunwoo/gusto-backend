# AUTH
AUTH001=AccessToken이 필요합니다.
AUTH002=유효하지 않은 AccessToken입니다.
AUTH003=어드민 권한이 필요합니다.

# URL
INVALID_URL=유효하지 않은 URL 형식입니다.

# Edge (재료 간 관계)
EDGE001=첫 번째 재료 ID는 필수입니다.
