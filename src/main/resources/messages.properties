EDGE007=관계 요약은 255자 이하여야 합니다.
EDGE008=관계 ID는 필수입니다.
EDGE009=동일한 재료 간에는 관계를 생성할 수 없습니다.
EDGE010=이미 존재하는 관계입니다.
EDGE011=관계를 찾을 수 없습니다.

