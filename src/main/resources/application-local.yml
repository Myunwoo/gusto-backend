springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    root: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.data.jpa.repository.query: DEBUG
    org.springframework.transaction: DEBUG
    com.gustoexpedition: DEBUG
  file:
    name: logs/gusto-backend.log

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gusto
    username: gusto
    password: gusto
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false
    open-in-view: false

LOG_FORMAT: PLAIN
LOG_PATH: ./logs

gusto:
  cors:
    # 로컬 환경: localhost:3000 명시적으로 허용 (credentials 사용을 위해)
    # CORS 스펙: credentials를 사용하려면 와일드카드(*)가 아닌 구체적인 origin이어야 함
    allowed-origins:
      - http://localhost:3000
    allow-credentials: true
